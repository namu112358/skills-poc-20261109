# 標準 CI（Node.js の例。コマンドはプロジェクトに合わせて変更する）
# - このジョブ名（ci）を Ruleset の Required Status Checks に登録する。
# - Required Check のジョブに if: や Workflow 単位の paths フィルターを付けない。
# - Action はコミット SHA で固定する（Dependabot が更新 PR を作る）。
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # シークレット検出で PR の全コミットを見るため

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # 依存関係の既知の脆弱性（Dependency Review を使えない Private リポジトリ向け）
      - run: npm audit --audit-level=high --omit=dev

      # シークレット検出（Secret Protection を使えない Private リポジトリ向け）
      # Gitleaks のバイナリを固定バージョン・固定チェックサムで取得する。
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
