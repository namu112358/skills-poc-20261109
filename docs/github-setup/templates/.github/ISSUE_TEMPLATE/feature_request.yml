name: 機能要望
description: 新しい機能や改善を提案する
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景・目的
      description: 解決したい課題
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 完了の判断基準。テストで確認できる形で書く（AI エージェントに作業を渡す場合は必須）
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: 対象外
      description: 今回は扱わないこと
