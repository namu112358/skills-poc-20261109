name: バグ報告
description: 不具合を報告する
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きているか
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: バージョン、OS、ブラウザなど。ログに認証情報や個人情報を含めないこと
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 修正完了の判断基準（AI エージェントに作業を渡す場合は必須）
