name: poc-app

on:
  pull_request:
    paths: ["poc-app/**", ".github/workflows/poc-app.yml"]
  push:
    branches: [main]
    paths: ["poc-app/**", ".github/workflows/poc-app.yml"]

permissions:
  contents: read

jobs:
  check:
    name: poc-app-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: poc-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
